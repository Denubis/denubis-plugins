[project]
name = "denubis-plugins"
version = "0.0.0"
description = "Claude Code plugins — tests only"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
    "tomlkit==0.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "bibtexparser>=2.0.0b9",
    "hypothesis>=6.0",
    "textual==8.2.8",
    "websockets==16.0",
    # Lint, type and complexity tooling, added 2026-10-21 after the approver
    # project's 2026-10-13 layout. Exact pins where a release changes the
    # finding set; bump deliberately and re-baseline scripts/lint.sh.
    "complexipy==8.0.1",
    "pre-commit>=4.6.2",
    "ruff==0.16.9",
    "ty==0.0.84",
    "vulture>=2.16",
]

[tool.uv.workspace]
members = [
    "plugins/denubis-plan-and-execute/scripts/workflow_statusline",
    "plugins/denubis-crash-recovery/scripts/crash_recovery",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "plugins/denubis-plan-and-execute/scripts/workflow_statusline/tests",
    "plugins/denubis-crash-recovery/scripts/crash_recovery/tests",
    "plugins/denubis-token-estimator/tests",
]

# Lint, type and complexity gates, added 2026-10-21. Warn-only for now:
# scripts/lint.sh prints every tool's result and exits 0 unless LINT_STRICT=1,
# because the tree predates the gates (baseline on 2026-10-21: ruff 81 findings
# and 40 unformatted files (18 Markdown), ty 184 diagnostics, complexipy 58 functions over 15
# outside tests, vulture 9). The thresholds are the target, not the current
# state. The pre-commit hooks that DO block are plugin validation, pytest,
# gitleaks and the broken-file checks, which are not lint noise.

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".worktrees"]

# A file's target must match its PEP 723 `requires-python`: at py314 the
# formatter rewrites `except (A, B):` into the parenthesis-free form, which is
# a SyntaxError below 3.14 (see CLAUDE.md, caught 2026-09-03). Verified on
# 2026-10-21 that this table governs `ruff format`, not only the linter.
[tool.ruff.per-file-target-version]
"plugins/*/hooks/*.py" = "py39"
"plugins/denubis-external-agents/skills/supervising-codex/hooks/install-codex-hooks.py" = "py39"
"plugins/denubis-external-agents/scripts/update_codex_profile.py" = "py310"
# The nine `>=3.11` bibliography scripts and every module they import.
# resolve.py and register_export.py declare `>=3.14` and stay at the default.
"plugins/denubis-academic/skills/using-bibliography/annotate.py" = "py311"
"plugins/denubis-academic/skills/using-bibliography/bbt.py" = "py311"
"plugins/denubis-academic/skills/using-bibliography/collection.py" = "py311"
"plugins/denubis-academic/skills/using-bibliography/copy_item.py" = "py311"
"plugins/denubis-academic/skills/using-bibliography/create_item.py" = "py311"
"plugins/denubis-academic/skills/using-bibliography/fetch.py" = "py311"
"plugins/denubis-academic/skills/using-bibliography/ingest.py" = "py311"
"plugins/denubis-academic/skills/using-bibliography/item_collections.py" = "py311"
"plugins/denubis-academic/skills/using-bibliography/renderer.py" = "py311"
"plugins/denubis-academic/skills/using-bibliography/trash_item.py" = "py311"
"plugins/denubis-academic/skills/using-bibliography/update_item.py" = "py311"
"plugins/denubis-academic/skills/using-bibliography/write_gate.py" = "py311"
"plugins/denubis-academic/skills/using-bibliography/zotero_auth.py" = "py311"
"plugins/denubis-academic/skills/using-bibliography/zotero_local_api.py" = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented-out code)
    "PL",   # Pylint
    "RUF",  # Ruff-specific
]
ignore = [
    "PLR0913",  # Too many arguments to function call
    "PLR2004",  # Magic value used in comparison
    "S404",     # subprocess import — CLI/hook tooling uses it intentionally
    "S603",     # subprocess call without shell check — args are controlled
    "S607",     # partial executable path — uv, gh, git resolved via PATH
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101",     # asserts are the test mechanism
    "S105",     # hardcoded test tokens are intentional fixtures
    "S106",     # hardcoded test tokens passed as args are intentional
    "S108",     # /tmp paths in test setup are intentional
    "S110",     # bare except:pass in test teardown
    "S608",     # tests build SQL strings as fixtures; no untrusted input
    "PLC0415",  # imports inside test functions (mocking/isolation)
    "ARG",      # unused fixture/mock/callback args are normal in tests
    "PLW1510",  # subprocess.run in tests asserts on the result; no check= needed
]
"**/test_*.py" = [
    "S101",
    "S105",
    "S106",
    "S108",
    "S110",
    "PLC0415",
    "ARG",
    "PLW1510",
]
# --- source-file ignores: documented intentional patterns -------------------
# bib skills are PEP-723 scripts: heavy/optional deps (httpx, pymupdf, docling,
# torch) are imported lazily inside the shell functions so the pure functional
# core stays importable and unit-testable without those (gigabyte) deps. The
# parsers' branch/statement counts are inherent to the formats they handle.
"plugins/denubis-academic/skills/using-bibliography/annotate.py" = ["PLC0415"]
"plugins/denubis-academic/skills/academic-writing/prose_shape.py" = ["PLC0415"]
"plugins/denubis-academic/skills/using-bibliography/fetch.py" = [
    "PLC0415",
    "PLR0912",
    "PLR0915",
]
"plugins/denubis-academic/skills/using-bibliography/renderer.py" = ["PLC0415"]
"plugins/denubis-academic/skills/using-bibliography/zotero_auth.py" = ["PLC0415"]
"plugins/denubis-academic/skills/using-bibliography/ingest.py" = [
    "PLR0912",
    "PLR0915",
]
# typer requires its Option()/Argument() sentinels CALLED in parameter defaults.
"plugins/denubis-crash-recovery/scripts/crash_recovery/src/crash_recovery/__main__.py" = [
    "B008",
]
# Dispatch/return tables and the audit harness's single linear pass (kept flat
# for line-by-line auditability) — refactoring tested code for a count metric
# isn't worth the risk.
"plugins/denubis-crash-recovery/scripts/crash_recovery/src/crash_recovery/jsonl.py" = [
    "PLR0911",
]
"plugins/denubis-crash-recovery/scripts/crash_recovery/src/crash_recovery/render.py" = [
    "PLR0911",
]
"plugins/denubis-plan-and-execute/scripts/workflow_statusline/src/workflow_statusline/__main__.py" = [
    "PLR0915",
]
"plugins/denubis-token-estimator/scripts/estimate.py" = ["PLR0912"]
"plugins/denubis-token-estimator/scripts/verify.py" = ["PLR0912", "PLR0915"]
# statusline caches/locks live at stable /tmp paths by design (cross-process,
# survive restarts) — S108's "insecure temp file" warning doesn't apply.
"plugins/denubis-plan-and-execute/scripts/workflow_statusline/src/workflow_statusline/cache.py" = [
    "S108",
]
"plugins/denubis-plan-and-execute/scripts/workflow_statusline/src/workflow_statusline/git.py" = [
    "S108",
]
"plugins/denubis-plan-and-execute/scripts/workflow_statusline/src/workflow_statusline/tmux.py" = [
    "S108",
]

[tool.ruff.format]
# Markdown code blocks are formatted (ADR 0031). Files vendored verbatim from an
# upstream repository are excluded by name so the next upstream sync diffs clean.
exclude = [
    "plugins/denubis-extending-agents/skills/writing-skills/anthropic-best-practices.md",
]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = [".worktrees"]

[tool.complexipy]
paths = ["."]
max_complexity_allowed = 15
# Test functions are not subject to the complexity gate, as in the sibling
# projects. Nothing else is excluded: the ratchet is a count, not a list.
exclude = ["**/tests/**", "**/test_*.py", "**/.venv/**", "**/.worktrees/**"]

[tool.vulture]
min_confidence = 80
paths = ["plugins", "scripts", "tests", "docs"]
exclude = ["*__pycache__*", ".venv", ".worktrees"]
