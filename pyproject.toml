[project]
name = "denubis-plugins"
version = "0.0.0"
description = "Claude Code plugins — tests only"
requires-python = ">=3.14"

[dependency-groups]
dev = ["pytest>=8.0", "bibtexparser>=2.0.0b9"]

[tool.uv.workspace]
members = [
    "plugins/denubis-plan-and-execute/scripts/workflow_statusline",
    "plugins/denubis-crash-recovery/scripts/crash_recovery",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "plugins/denubis-plan-and-execute/scripts/workflow_statusline/tests",
    "plugins/denubis-crash-recovery/scripts/crash_recovery/tests",
    "plugins/denubis-token-estimator/tests",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented-out code)
    "PL",   # Pylint
    "RUF",  # Ruff-specific
]
ignore = [
    "PLR0913",  # Too many arguments to function call
    "PLR2004",  # Magic value used in comparison
    "S404",     # subprocess import — CLI/hook tooling uses it intentionally
    "S603",     # subprocess call without shell check — args are controlled
    "S607",     # partial executable path — uv, gh, git resolved via PATH
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101",     # asserts are the test mechanism
    "S105",     # hardcoded test tokens are intentional fixtures
    "S106",     # hardcoded test tokens passed as args are intentional
    "S108",     # /tmp paths in test setup are intentional
    "S110",     # bare except:pass in test teardown
    "S608",     # tests build SQL strings as fixtures; no untrusted input
    "PLC0415",  # imports inside test functions (mocking/isolation)
    "ARG",      # unused fixture/mock/callback args are normal in tests
    "PLW1510",  # subprocess.run in tests asserts on the result; no check= needed
]
"**/test_*.py" = [
    "S101",
    "S105",
    "S106",
    "S108",
    "S110",
    "PLC0415",
    "ARG",
    "PLW1510",
]
# --- source-file ignores: documented intentional patterns -------------------
# bib skills are PEP-723 scripts: heavy/optional deps (httpx, pymupdf, docling,
# torch) are imported lazily inside the shell functions so the pure functional
# core stays importable and unit-testable without those (gigabyte) deps. The
# parsers' branch/statement counts are inherent to the formats they handle.
"plugins/denubis-bibliography/skills/using-bibliography/annotate.py" = ["PLC0415"]
"plugins/denubis-bibliography/skills/using-bibliography/fetch.py" = [
    "PLC0415",
    "PLR0912",
    "PLR0915",
]
"plugins/denubis-bibliography/skills/using-bibliography/renderer.py" = ["PLC0415"]
"plugins/denubis-bibliography/skills/using-bibliography/ingest.py" = [
    "PLR0912",
    "PLR0915",
]
# typer requires its Option()/Argument() sentinels CALLED in parameter defaults.
"plugins/denubis-crash-recovery/scripts/crash_recovery/src/crash_recovery/__main__.py" = [
    "B008",
]
# Dispatch/return tables and the audit harness's single linear pass (kept flat
# for line-by-line auditability) — refactoring tested code for a count metric
# isn't worth the risk.
"plugins/denubis-crash-recovery/scripts/crash_recovery/src/crash_recovery/jsonl.py" = [
    "PLR0911",
]
"plugins/denubis-crash-recovery/scripts/crash_recovery/src/crash_recovery/render.py" = [
    "PLR0911",
]
"plugins/denubis-plan-and-execute/scripts/workflow_statusline/src/workflow_statusline/__main__.py" = [
    "PLR0915",
]
"plugins/denubis-token-estimator/scripts/estimate.py" = ["PLR0912"]
"plugins/denubis-token-estimator/scripts/verify.py" = ["PLR0912", "PLR0915"]
# statusline caches/locks live at stable /tmp paths by design (cross-process,
# survive restarts) — S108's "insecure temp file" warning doesn't apply.
"plugins/denubis-plan-and-execute/scripts/workflow_statusline/src/workflow_statusline/cache.py" = [
    "S108",
]
"plugins/denubis-plan-and-execute/scripts/workflow_statusline/src/workflow_statusline/git.py" = [
    "S108",
]
"plugins/denubis-plan-and-execute/scripts/workflow_statusline/src/workflow_statusline/tmux.py" = [
    "S108",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
