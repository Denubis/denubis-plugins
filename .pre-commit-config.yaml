# Pre-commit hooks, added 2026-10-21. Install with `uv run pre-commit install`.
#
# The lint, type and complexity tools run through scripts/lint.sh in warn-only
# mode: the hook prints every tool's result and never blocks a commit until
# LINT_STRICT=1 is set there. The hooks that do block are the two gates the
# former scripts/pre-commit ran (plugin validation, pytest) and the ones that
# catch a secret, a broken file or a conflict marker, which are not lint noise.
repos:
  - repo: local
    hooks:
      - id: lint-report
        name: lint report (ruff, ty, complexipy, vulture; warn-only)
        entry: scripts/lint.sh
        language: system
        always_run: true
        pass_filenames: false
        verbose: true

      - id: claude-plugin-validate
        name: claude plugin validate --strict
        entry: claude plugin validate . --strict
        language: system
        always_run: true
        pass_filenames: false

      # Bare pytest runs every root testpath: tests/ plus the token-estimator,
      # crash-recovery and status-line suites. --all-packages installs the
      # workspace members those suites import; a checkout synced without it
      # fails collection.
      - id: pytest
        name: pytest (all configured testpaths)
        entry: uv run --frozen --all-packages pytest -q
        language: system
        always_run: true
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=700]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
