[project]
name = "workflow-statusline"
version = "0.1.0"
description = "Claude Code tmux status line renderer"
requires-python = ">=3.12"

[project.scripts]
workflow-statusline = "workflow_statusline.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_statusline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
