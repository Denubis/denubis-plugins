id: global-mutable-state
language: python
message: "Module-level mutable assignment — consider Encapsulate Variable or module-level function"
severity: warning
rule:
  all:
    - kind: assignment
    - inside:
        kind: module
        stopBy: end
    - not:
        inside:
          any:
            - kind: function_definition
            - kind: class_definition
          stopBy: end
    - has:
        field: left
        kind: identifier
        regex: "^[a-z]|^_[a-z]"
